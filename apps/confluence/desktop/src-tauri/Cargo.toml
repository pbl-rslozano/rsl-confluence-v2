[package]
name = "rsl-confluence-desktop"
version = "2.7.0"
description = "rsL Confluence Terminal — desktop shell"
authors = ["rsLozano"]
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "rsl_confluence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = ["isolation"] }

[dependencies]
tauri = { version = "=2.12.5", features = ["isolation"] }
tauri-plugin-sql = { version = "=2.6.0", features = ["sqlite"] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-fs = "=2.7.1"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-window-state = "=2.5.0"
# v2.6 (ADR-0013): native GET for Coins.ph public market data; scope in capabilities/main.json. No cookie store.
tauri-plugin-http = { version = "=2.8.3", default-features = false, features = ["rustls-tls", "http2", "charset"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
