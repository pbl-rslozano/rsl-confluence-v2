# rsL Confluence Terminal — phone builds (v2.3.1).
# Two separate jobs, two separate downloads:
#   • android-apk  — signed release APK for direct install (sideload) on Android 7+.
#   • iphone-ipa   — UNSIGNED .ipa; sign and install it yourself with Sideloadly + your Apple ID.
# Superseded by release.yml for v2.4; retained for manual legacy builds.
# Signing material comes only from repository secrets; nothing secret is in the repo or the artifacts.
# Personal edition, paper trading only — the app sends no exchange orders. Not financial advice.
name: legacy-mobile

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22.23.4"
  PNPM_VERSION: "10.34.9"

jobs:
  android:
    name: Android — signed APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      # GitHub's Ubuntu image ships the Android SDK (ANDROID_HOME); android-actions/setup-android@v3
      # fails there because it still asks sdkmanager for the removed 'tools' package.
      - name: Android SDK (preinstalled on the runner)
        run: |
          test -d "$ANDROID_HOME"
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          echo "Android SDK: $ANDROID_HOME"
      - run: pnpm install --frozen-lockfile
      - name: Web build (Capacitor target), native project, hardening, version stamp
        working-directory: apps/confluence/mobile
        run: |
          pnpm run web
          [ -d android ] || pnpm exec cap add android
          node ../../../tools/apply-native-config.mjs android
          pnpm exec cap sync android
      # Android refuses to install an unsigned APK, so a missing key is an error, not a warning.
      - name: Signing keystore from secrets
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::error title=No signing key::Add the ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD repository secrets."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_B64" | tr -d '\r\n\t ' | sed -E 's/-----(BEGIN|END)[^-]*-----//g' | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build APK
        working-directory: apps/confluence/mobile/android
        env:
          RSL_KEYSTORE: ${{ runner.temp }}/release.keystore
          RSL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RSL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RSL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Name, verify signature, checksum
        run: |
          BUILD=$(sed -n 's/.*build: "\([0-9]\{8\}\)".*/\1/p' apps/confluence/web/src/rsl/app-info.ts)
          mkdir -p out-apk
          cp apps/confluence/mobile/android/app/build/outputs/apk/release/app-release.apk "out-apk/rsL-Confluence-v2.3-2026-build${BUILD}.apk"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          # apksigner exits non-zero for an unsigned or broken APK; that exit code is the check.
          # (Its wording varies by version, e.g. "Signer #1 …" or "Signer (minSdkVersion=…) …".)
          "$APKSIGNER" verify --print-certs "out-apk/rsL-Confluence-v2.3-2026-build${BUILD}.apk" > "$RUNNER_TEMP/signer.txt"
          grep -E "certificate (DN|SHA-256 digest)" "$RUNNER_TEMP/signer.txt" || cat "$RUNNER_TEMP/signer.txt"
          (cd out-apk && sha256sum *.apk > "rsL-Confluence-v2.3-2026-build${BUILD}.apk.sha256")
      - name: R13 — rsL icon in the APK (v2.5)
        run: |
          python3 -m pip install --quiet pillow==11.3.0
          python3 tools/check-icons.py --apk out-apk/*.apk --expected tools/icon-fixtures/rsl-192.png
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out-apk/*
          if-no-files-found: error
      - name: Clean up key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

  iphone:
    name: iPhone — unsigned IPA (sign with Sideloadly)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Web build (Capacitor target), native project (Swift Package Manager), ATS check, version stamp
        working-directory: apps/confluence/mobile
        run: |
          pnpm run web
          [ -d ios ] || pnpm exec cap add ios --packagemanager SPM
          node ../../../tools/apply-native-config.mjs ios
          pnpm exec cap sync ios
      - name: Build for device without signing
        working-directory: apps/confluence/mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package .ipa (Payload/App.app) and checksum
        run: |
          BUILD=$(sed -n 's/.*build: "\([0-9]\{8\}\)".*/\1/p' apps/confluence/web/src/rsl/app-info.ts)
          APPDIR=apps/confluence/mobile/ios/App/build/Build/Products/Release-iphoneos/App.app
          test -d "$APPDIR"
          mkdir -p out-ipa/Payload
          cp -R "$APPDIR" out-ipa/Payload/
          (cd out-ipa && zip -qry "rsL-Confluence-v2.3-2026-build${BUILD}-unsigned.ipa" Payload && rm -rf Payload \
            && shasum -a 256 *.ipa > "rsL-Confluence-v2.3-2026-build${BUILD}-unsigned.ipa.sha256")
      - name: R13 — rsL icon in the IPA (v2.5)
        run: |
          python3 -m pip install --quiet pillow==11.3.0 || python3 -m pip install --quiet --break-system-packages pillow==11.3.0
          python3 tools/check-icons.py --ipa out-ipa/*.ipa --expected tools/icon-fixtures/rsl-ios-180.png
      - uses: actions/upload-artifact@v4
        with:
          name: iphone-ipa
          path: out-ipa/*
          if-no-files-found: error
