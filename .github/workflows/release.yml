# rsL Confluence Terminal — CI build, gate and release (builder skill §8.1).
# v2.2: the gate (tests, release-check, PWA, acceptance) runs on every push and pull request;
# installers are built only for version tags.
# Builds run in CI only. Signing material comes from repository secrets; nothing secret is in the repo.
# Supply chain: frozen lockfile, lifecycle scripts limited by pnpm onlyBuiltDependencies, exact versions.
# Actions are pinned to verified upstream commit SHAs.
name: release

on:
  push:
    branches: ["main"]
    tags: ["v*", "!v*-windows", "!v*-macos", "!v*-android", "!v*-iphone", "!v*-web", "!v*-linux"]
  pull_request:
  workflow_dispatch:
    inputs:
      ios_export_method:
        description: iPhone distribution profile type
        type: choice
        options: [release-testing, app-store-connect]
        default: release-testing
      draft:
        description: Keep releases as drafts for installation review
        type: boolean
        default: true

permissions:
  contents: read

env:
  NODE_VERSION: "22.23.4"
  PNPM_VERSION: "10.34.9"
  # v2.6 (WP10): the source commit every build shows in About and stamps into build-manifest.json.
  NEXT_PUBLIC_GIT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Gate — tests, release-check, PWA, acceptance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node --test tools/set-android-version.test.mjs tools/release-policy.test.mjs
      - name: R14 — no acceptance check present on the base branch may disappear (snapshot-upload guard)
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node tools/check-acceptance-ids.mjs --base "$BASE_REF"
      - name: Icon checker tests and vendored menu fonts match their lock
        run: |
          python3 -m pip install --quiet pillow==12.3.0 fonttools==4.67.0 brotli==1.1.0 || python3 -m pip install --quiet --break-system-packages pillow==12.3.0 fonttools==4.67.0 brotli==1.1.0
          python3 tools/check-icons.test.py
          python3 tools/build-menu-fonts.py --check
      - name: Third-party notices complete (WP20) — every shipped component has a licence text
        run: node tools/third-party-notices.mjs --check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm sbom
      - run: node tools/release-check.mjs --with-tests
      - run: pnpm build:pwa
      - name: Acceptance (Playwright + axe, mocked exchanges)
        run: |
          pnpm exec playwright install --with-deps chromium
          # v2.5 L-1 renders all 18 languages; Noto covers Indic, Arabic/Urdu and CJK scripts on the runner.
          sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-noto-cjk > /dev/null
          (cd apps/confluence/web/out && python3 -m http.server 8770 --bind 127.0.0.1 &) ; sleep 2
          pnpm e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pwa-sbom-evidence
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.cdx.json
            tools/e2e/evidence/
          if-no-files-found: error
      # v2.6 WP8 (ADR-0014): the minified, un-obfuscated build for audits and the manifest that links it by
      # hash to the protected build that shipped. CI artifacts only, never in a release.
      - name: R17 — protected build (no maps, own chunks only, vendor byte-identical)
        run: node tools/checks/protected-build.mjs --out apps/confluence/web/out --manifest apps/confluence/web/build-manifest.json --minified apps/confluence/web/dist-minified
      - name: BG-4 — engine golden replay, protected vs minified (identical results, speed within BG-5)
        run: node tools/protect-golden.mjs --minified apps/confluence/web/dist-minified --protected apps/confluence/web/out --write apps/confluence/web/build-golden.json
      - name: R18 — protected equivalence (BG-3 acceptance + BG-4 golden on this exact protected tree)
        run: |
          node tools/checks/protected-build.mjs evidence --out apps/confluence/web/out --manifest apps/confluence/web/build-manifest.json \
            --acceptance tools/e2e/evidence/results.json --golden apps/confluence/web/build-golden.json --write apps/confluence/web/build-evidence.json > /dev/null
          node tools/checks/protected-build.mjs equivalence --evidence apps/confluence/web/build-evidence.json --manifest apps/confluence/web/build-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: protected-build-audit
          path: |
            apps/confluence/web/dist-minified/
            apps/confluence/web/build-manifest.json
            apps/confluence/web/build-golden.json
            apps/confluence/web/build-evidence.json
          if-no-files-found: error

  windows:
    name: Desktop — ${{ 'windows-latest' }}
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { targets: "${{ 'windows-latest' == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}" }
      - run: pnpm install --frozen-lockfile
      - name: Prepare macOS notarization key
        if: false
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in CERT PASSWORD IDENTITY KEY_B64 KEY_ID ISSUER; do
            [ -n "${!name}" ] || { echo "::error::Missing macOS signing setting $name"; exit 1; }
          done
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build and sign
        env:
          # macOS: Developer ID Application certificate + notarisation (App Store Connect API key).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # Windows: signing is configured in tauri.conf.json bundle.windows (signCommand) once a certificate exists.
        run: pnpm --filter @rsl/confluence-desktop tauri build ${{ '' }}
      - name: Remove notarization key
        if: always() && 'windows' == 'macos'
        shell: bash
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ 'windows' }}
          path: |
            apps/confluence/desktop/src-tauri/target/**/release/bundle/msi/*.msi
            apps/confluence/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/confluence/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error

  macos:
    name: Desktop — ${{ 'macos-latest' }}
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[release-apple]')))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { targets: "${{ 'macos-latest' == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}" }
      - run: pnpm install --frozen-lockfile
      - name: Prepare macOS notarization key
        if: true
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$CERT$PASSWORD$IDENTITY$KEY_B64$KEY_ID$ISSUER" ]; then
            echo "RSL_MACOS_UNSIGNED=true" >> "$GITHUB_ENV"
            echo "::warning::Building an ad-hoc signed macOS package without notarization."
            exit 0
          fi
          for name in CERT PASSWORD IDENTITY KEY_B64 KEY_ID ISSUER; do
            [ -n "${!name}" ] || { echo "::error::Missing macOS signing setting $name"; exit 1; }
          done
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build and sign
        env:
          # macOS: Developer ID Application certificate + notarisation (App Store Connect API key).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # Windows: signing is configured in tauri.conf.json bundle.windows (signCommand) once a certificate exists.
        shell: bash
        run: |
          if [ "${RSL_MACOS_UNSIGNED:-}" = true ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH
            export APPLE_SIGNING_IDENTITY=-
          fi
          pnpm --filter @rsl/confluence-desktop tauri build --target universal-apple-darwin --bundles dmg,app
          if [ "${RSL_MACOS_UNSIGNED:-}" = true ]; then
            for file in apps/confluence/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
              mv "$file" "${file%.dmg}-unnotarized.dmg"
            done
          fi
      - name: Remove notarization key
        if: always() && 'macos' == 'macos'
        shell: bash
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ 'macos' }}
          path: |
            apps/confluence/desktop/src-tauri/target/**/release/bundle/msi/*.msi
            apps/confluence/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/confluence/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error

  android:
    name: Android — .aab + .apk
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[release-android]')))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: "21" }
      - name: Android SDK (preinstalled on runner)
        run: |
          test -d "$ANDROID_HOME"
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - run: pnpm install --frozen-lockfile
      - name: Generate native project and apply hardening
        working-directory: apps/confluence/mobile
        run: |
          pnpm run web
          [ -d android ] || pnpm exec cap add android
          node ../../../tools/apply-native-config.mjs android
          node ../../../tools/set-android-version.mjs
          pnpm exec cap sync android
      # A step's `if` cannot see its own env, so the secret's presence is tested in the script.
      - name: Signing keystore from secrets
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | tr -d '\r\n\t ' | sed -E 's/-----(BEGIN|END)[^-]*-----//g' | base64 -d > "$RUNNER_TEMP/release.keystore"
          else
            echo "::error::ANDROID_KEYSTORE_B64 is required for Android release packages."
            exit 1
          fi
      - name: Build
        working-directory: apps/confluence/mobile/android
        env:
          RSL_KEYSTORE: ${{ runner.temp }}/release.keystore
          RSL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RSL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RSL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease
      - name: R13 — rsL icon in the APK
        run: |
          # Own venv: runner images mark the system Python externally managed (PEP 668), so a bare pip install fails.
          python3 -m venv "$RUNNER_TEMP/icon-check"
          "$RUNNER_TEMP/icon-check/bin/python" -m pip install --quiet pillow==11.3.0
          for apk in apps/confluence/mobile/android/app/build/outputs/apk/release/*.apk; do
            "$RUNNER_TEMP/icon-check/bin/python" tools/check-icons.py --apk "$apk" --expected tools/icon-fixtures/rsl-192.png
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-android
          path: |
            apps/confluence/mobile/android/app/build/outputs/bundle/release/*.aab
            apps/confluence/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # v2.5.1 update channel (ADR-0012): the PWA, /updates/latest.json and the signed APK go to Netlify as one
  # atomic deploy. Runs only on release runs, after the gate and the Android build (R13 icon check) pass.
  publish:
    name: Update channel — Netlify (PWA + latest.json + APK)
    needs: [verify, android]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[release-android]')))
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    concurrency: { group: update-channel, cancel-in-progress: false }
    env:
      UPDATE_SITE: effervescent-bubblegum-1e5c03.netlify.app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:pwa
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: installer-android, path: android-build }
      # A step's `if` cannot see secrets, so the token's presence is tested in the script (no token → no deploy).
      - name: Publish to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          apk=$(find android-build -name '*.apk' | head -1)
          test -n "$apk" || { echo "::error::no APK in the installer-android artifact"; exit 1; }
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            # v2.6: a release run that deploys nothing must not look green (v2.6.0 run 42394112691 did).
            node tools/publish-update.mjs --dir apps/confluence/web/out --apk "$apk" --site "$UPDATE_SITE" --dry-run
            echo "::error title=Update channel not published::NETLIFY_AUTH_TOKEN repository secret is missing, so nothing was deployed. Add a Netlify personal access token as that secret and re-run."
            exit 1
          fi
          node tools/publish-update.mjs --dir apps/confluence/web/out --apk "$apk" --site "$UPDATE_SITE"
      - name: Check the published manifest
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          [ -n "$NETLIFY_AUTH_TOKEN" ] || exit 0
          build=$(sed -n 's/.*build: "\([0-9]\{8\}\)".*/\1/p' apps/confluence/web/src/rsl/app-info.ts)
          version=$(node -p "require('./package.json').version")
          curl -fsS --retry 5 --retry-delay 5 "https://$UPDATE_SITE/updates/latest.json" -o latest.json
          node -e 'const m=require("./latest.json"); if (m.version!==process.argv[1]||m.build!==process.argv[2]) { console.error("served", m.version, m.build); process.exit(1) } console.log("served", m.version, m.build, m.android && m.android.file)' "$version" "$build"
          curl -fsSI "https://$UPDATE_SITE/updates/$(node -p 'require("./latest.json").android.file')" | grep -i '^content-length'

  ios:
    name: iPhone — signed or unsigned device package
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[release-apple]')))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Generate native project (Swift Package Manager) and check ATS
        working-directory: apps/confluence/mobile
        run: |
          pnpm run web
          [ -d ios ] || pnpm exec cap add ios --packagemanager SPM
          node ../../../tools/apply-native-config.mjs ios
          pnpm exec cap sync ios
      - name: Build iPhone device package
        env:
          IOS_CERTIFICATE_B64: ${{ secrets.IOS_CERTIFICATE_B64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_B64: ${{ secrets.IOS_PROFILE_B64 }}
          IOS_EXPORT_METHOD: ${{ inputs.ios_export_method || 'release-testing' }}
        run: bash tools/build-ios-release.sh
      - name: R13 — rsL icon in the IPA
        run: |
          # Own venv: runner images mark the system Python externally managed (PEP 668), so a bare pip install fails.
          python3 -m venv "$RUNNER_TEMP/icon-check"
          "$RUNNER_TEMP/icon-check/bin/python" -m pip install --quiet pillow==11.3.0
          for ipa in dist/ios/*.ipa; do
            "$RUNNER_TEMP/icon-check/bin/python" tools/check-icons.py --ipa "$ipa" --expected tools/icon-fixtures/rsl-ios-180.png
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-iphone
          path: dist/ios/*.ipa
          if-no-files-found: error

  publish_windows:
    name: Release — ${{ 'windows' }}
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installer-${{ 'windows' }}
          path: release-files
      - name: Publish platform release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ 'windows' }}
          DRAFT: ${{ github.event_name != 'workflow_dispatch' || inputs.draft }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v$version-$PLATFORM"
          mapfile -d '' files < <(find release-files -type f -print0)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::No installer artifacts"; exit 1; }
          for file in "${files[@]}"; do (cd "$(dirname "$file")" && sha256sum "$(basename "$file")") > "$file.sha256"; done
          notes="$RUNNER_TEMP/release-notes.md"
          printf 'Confluence Terminal %s for %s.\n\nSource commit: %s\n' "$version" "$PLATFORM" "$GITHUB_SHA" > "$notes"
          if [ "$PLATFORM" = iphone ]; then
            printf '\nAn unsigned IPA must be signed for your device before installation. A signed IPA requires its matching distribution profile.\n' >> "$notes"
          fi
          if [ "$PLATFORM" = macos ]; then
            printf '\nAssets labeled unnotarized use ad-hoc signing and have no Apple notarization.\n' >> "$notes"
          fi
          if [ "$PLATFORM" = linux ]; then
            printf '\n.deb for Debian/Ubuntu, .rpm for Fedora/openSUSE, .AppImage for any distribution (make it executable). Packages are unsigned; check the SHA-256.\n' >> "$notes"
          fi
          if [ "$PLATFORM" = web ]; then
            printf '\nThe web app as a zip: unzip it and run the included launcher (Node.js 22) to use it on this computer, including the Coins.ph source. The hosted version is at https://effervescent-bubblegum-1e5c03.netlify.app\n' >> "$notes"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            options=()
            [ "$DRAFT" != true ] || options+=(--draft)
            gh release create "$tag" --target "$GITHUB_SHA" --title "Confluence Terminal $version — $PLATFORM" --notes-file "$notes" "${options[@]}"
          else
            target="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>/dev/null || gh release view "$tag" --json targetCommitish --jq .targetCommitish)"
