  # v2.6: Linux desktop (Tauri 2 on WebKitGTK 4.1) — .deb (Debian/Ubuntu), .rpm (Fedora/openSUSE), .AppImage (any distro).
  linux:
    name: Desktop — ubuntu-22.04 (Linux)
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Linux build libraries (Tauri 2 prerequisites)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libfuse2 xdg-utils patchelf file rpm > /dev/null
      - run: pnpm install --frozen-lockfile
      - name: Build
        # Unsigned: Linux packages carry no platform signature; the release lists a SHA-256 for every file.
        run: pnpm --filter @rsl/confluence-desktop tauri build --bundles deb,rpm,appimage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-linux
          path: |
            apps/confluence/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/confluence/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/confluence/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

